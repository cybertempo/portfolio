# ─────────────────────────────────────────────────────────────────────────────
# PORTFOLIO CONTENT — the only file to edit to change what the site says.
#
# Change this file, then on the LAPTOP run:   bash scripts/build.sh
# The build validates every field, refuses anything wrong, and writes dist/.
# Never edit dist/ by hand; it is overwritten on every build.
#
# Markup allowed inside text values (everything else is shown literally):
#   **bold**               → bold
#   {primary}text{/}          → coloured text; tones: cyan purple magenta green yellow muted
#   //text                 → a whole line that is a comment in terminal output
#
# Links: leave a url as "" to hide that link. The build lists every hidden
# link so you know what is still missing; the visitor never sees a dead one.
# ─────────────────────────────────────────────────────────────────────────────

[identity]
first    = "Sreenandan"
last     = "Pradeep"
handle   = "sreenandan"                # shell-style username shown in prompts
host     = "portfolio"                 # shell-style hostname shown in prompts
role     = "Cybersecurity & Networking"   # appended to the browser tab title
email    = "sreenandanpradeep404@gmail.com"
location = "Ajman, UAE"
status   = "Open to work"              # the pill in the top-right corner
# The picture, as a file under src/assets/. It is derived automatically from
# source/<same name>.png — a background-removed PNG — whenever that changes.
# To swap it: put the new PNG in source/, change this line, build.
# (scripts/build-photo.py explains how to remove a background in one click.)
photo    = "sreenandan.webp"
# How much of the picture to show, from the top: 1.0 = the whole figure,
# 0.45 = head to chest. Changing it re-derives the web image on the next build.
photo_keep_top = 0.34

[design]
# Colour scheme: a file in content/palettes/ (see _README.md there). Swap the
# whole look by changing this one word and building.
palette = "neon-noir"
# The falling background streams spell this text as hexadecimal bytes (UTF-8).
rain_text = "sreenandan pradeep"
# A ghost of a failed request: this text glitches across the page every half
# minute or so, behind the content. Leave it empty to switch it off.
ghost_text = "404"
# Minimap module: folder under src/minimaps/. Swap independently of the palette.
minimap = "spider"

[minimap]
# Stencilled on the spider's abdomen, like a lab specimen. Empty for none;
# tag_tone is a palette slot: primary, secondary, tertiary, success,
# warning, danger or muted.
tag      = "404"
tag_tone = "warning"
title = "Page map"
toggle = "Page map"
start = "Start"
hint = "Drag to explore · select a node"
scrub = "Page position"

[meta]
# What search engines and link previews (LinkedIn, WhatsApp, X) show.
description = "Portfolio of Sreenandan Pradeep — Computer Science & Engineering graduate, cybersecurity & networking enthusiast, blockchain builder, full-stack developer. Highest GATE scorer of the 2026 batch at RSET."
