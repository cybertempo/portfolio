<nav class="rail" aria-label="{{map_title}}">
  <div class="rail-track">
    <div class="rail-silk" id="railFill"></div>
    <div class="rail-spider" id="railSpider" aria-hidden="true">
      <!-- abdomen up, head down: the silk comes from the spinnerets at the rear -->
      <svg viewBox="0 0 40 40" class="spider">
        <!-- one rig group so the whole animal can bob while it climbs, without
             disturbing the rotation on .spider that turns it head-up -->
        <g class="rig">
          <!-- the legs are scaled as a block: the gait computes in the drawing's
               own units, so scaling the group changes their reach without
               touching a single number in the behaviour -->
          <g class="leg-scale">
            <g class="legs legs-l">
              <path d="M16 16 L6 9 L2 12"/><path d="M15 19 L4 17 L1 21"/><path d="M15 22 L5 26 L2 32"/><path d="M16 25 L8 33 L7 38"/>
            </g>
            <g class="legs legs-r">
              <path d="M24 16 L34 9 L38 12"/><path d="M25 19 L36 17 L39 21"/><path d="M25 22 L35 26 L38 32"/><path d="M24 25 L32 33 L33 38"/>
            </g>
          </g>
          <ellipse class="body" cx="20" cy="22" rx="6" ry="7.5"/>
          <!-- specimen number, stencilled on the abdomen; it counter-rotates so it
               stays readable whichever way up the animal is hanging -->
          <text class="tag" x="20" y="22.4" text-anchor="middle" dominant-baseline="central">{{map_tag}}</text>
          <circle class="head" cx="20" cy="12.5" r="4"/>
          <circle class="eye" cx="18.4" cy="12" r="1"/><circle class="eye" cx="21.6" cy="12" r="1"/>
        </g>
      </svg>
    </div>
  </div>
  <ol class="rail-stops">
    <div class="rail-path" aria-hidden="true"></div>
{{rail_stops}}
  </ol>
</nav>
